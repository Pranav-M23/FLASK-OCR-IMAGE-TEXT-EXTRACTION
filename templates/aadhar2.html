<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <title>Aadhar Card Text Extraction using PaddleOCR</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <link rel="icon" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSxvuzxekeGukuKN9DsQ857l12NQJmUdVJkbQ&s" type="image/png">
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <div class="container">
        <h1><b>Aadhar Card Text Extraction</b></h1>
        <form action="/upload" method="post" enctype="multipart/form-data">
            <label>Aadhar Front Image:</label><br>
            <input type="file" name="front_image" accept="image/*" required><br><br>

            <label>Aadhar Back Image:</label><br>
            <input type="file" name="back_image" accept="image/*" required><br><br>
            
            <input type="submit" value="Extract Text">
        </form>

        <div id="result"></div>
    </div>
</body>
</html>
